[project]
name = "thoth"
version = "0.1.0"
description = "Controle web da mão protética HACKberry: comandos por serial + espelhamento da mão por visão computacional"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }  # firmware deriva do sketch HACKberry (GPLv3)
authors = [{ name = "Marco Aurelio Andrade" }]
readme = "README.md"
dependencies = [
    # --- Visão computacional ---
    "opencv-python>=4.10",           # captura de webcam (cv2.VideoCapture)
    "mediapipe>=0.10.14",            # Tasks API: HandLandmarker (rastreamento da mão)
    "numpy>=1.26",                   # vetores / cálculo de flexão dos dedos
    # --- Atuação / hardware (serial) ---
    "pyserial>=3.5",                 # base serial
    "pyserial-asyncio>=0.6",         # cliente serial assíncrono (HandLink)
    # --- API / web / config ---
    "fastapi>=0.115",                # API REST + lifespan
    "uvicorn[standard]>=0.30",       # servidor ASGI (inclui websockets)
    "websockets>=12.0",              # telemetria em tempo real (/ws)
    "pydantic>=2.7",                 # modelos de request/response
    "pydantic-settings>=2.3",        # Settings a partir de .env + YAML
    "pyyaml>=6.0",                   # leitura dos configs/*.yaml
    "loguru>=0.7",                   # logging estruturado
    # --- Agente conversacional (voz) ---
    "openai>=1.40",                  # cliente OpenAI-compatible (Cerebras/Groq/Rio-vLLM)
    "sounddevice>=0.4.6",            # captura de microfone / reprodução de áudio
    "soundfile>=0.12",               # ler/escrever WAV
    "webrtcvad-wheels>=2.0.14",      # detecção de voz (fim de turno) — wheels prontos
    "edge-tts>=6.1",                 # TTS neural online PT-BR (voz padrão do agente)
    "piper-tts>=1.2",                # TTS local PT-BR (fallback offline)
    "faster-whisper>=1.0",           # STT local (alternativa offline ao Groq Whisper)
    "wikipedia>=1.4",                # skill: pesquisa na Wikipédia
    # opcional (skill de música): pip install pywhatkit
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["hardware: testes que exigem a mão HACKberry conectada"]
